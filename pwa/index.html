<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>EISENBERG TRADER</title>
<style>
:root{--bg:#f4f6fa;--cd:#fff;--tx:#111827;--mu:#6b7280;--bd:#e2e6ee;--ac:#2563eb;--up:#0f9d58;--dn:#d93025;--wn:#b7791f;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--cd:#141c2e;--tx:#e8edf7;--mu:#8a96ad;--bd:#243049;--ac:#4f8cff;--up:#34d399;--dn:#f87171;--wn:#fbbf24;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1220;--cd:#141c2e;--tx:#e8edf7;--mu:#8a96ad;--bd:#243049;--ac:#4f8cff;--up:#34d399;--dn:#f87171;--wn:#fbbf24;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:12px 14px 6px;display:flex;gap:8px;align-items:center;justify-content:space-between}
h1{font-size:16px;letter-spacing:.12em;margin:0}
main{padding:6px 12px 90px;max-width:760px;margin:auto}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.warn{font-size:12px;color:var(--mu);border-left:3px solid var(--wn);padding:2px 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.g div{background:var(--bg);border-radius:10px;padding:8px}
.g b{display:block;font-size:17px}.g span,.mu{color:var(--mu);font-size:12px}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;border:1px solid currentColor}
.sim{color:var(--wn)}.real{color:var(--up)}
.pill{font-weight:800;padding:6px 14px;border-radius:99px;color:#fff}
.COMPRA{background:var(--up)}.VENDA{background:var(--dn)}.ESPERA{background:var(--mu)}
.up{color:var(--up)}.dn{color:var(--dn)}
canvas{width:100%;display:block}
select,input,textarea,button{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px}
button{background:var(--ac);color:#fff;border:0;font-weight:600}button.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}button.d{background:var(--dn)}
textarea{width:100%;min-height:70px}label{display:block;font-size:12px;color:var(--mu);margin-top:8px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--cd);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:12px 2px;font-size:12px}nav button.on{color:var(--ac)}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 4px;border-bottom:1px solid var(--bd);text-align:right}th:first-child,td:first-child{text-align:left}
.sc{overflow-x:auto}
</style></head><body>
<header><h1>EISENBERG TRADER</h1><select id="sel" aria-label="Ativo"></select></header>
<main id="v"></main>
<nav id="nav"></nav>
<script>
const $=s=>document.querySelector(s),KEY='et1',css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const f=(v,d=2)=>v==null||isNaN(v)?'–':Number(v).toFixed(d);
function prng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gen(sym){let h=0;for(const ch of sym)h=h*31+ch.charCodeAt(0);const r=prng(h),c=[];let p=100;for(let i=0;i<300;i++){p*=1+(r()-.495)*.03;c.push(+p.toFixed(2))}return c}
const mk=sym=>({sym,name:'Ativo simulado',src:'sim',c:gen(sym)});
function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.assets&&j.assets.length)return j}catch(e){}
return{assets:['SIM-ALFA','SIM-BETA','SIM-GAMA'].map(mk),sel:0,cfg:{bal:10000,risk:1,sl:2,tp:4},cash:10000,pos:[],hist:[]}}
let S=load(),tab='dash',msg='';
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const A=()=>S.assets[S.sel]||S.assets[0];
/* ===== indicadores ===== */
function sma(a,n){return a.map((_,i)=>i<n-1?null:a.slice(i-n+1,i+1).reduce((x,y)=>x+y,0)/n)}
function ema(a,n){const k=2/(n+1);const o=[];a.forEach((v,i)=>o.push(i?v*k+o[i-1]*(1-k):v));return o}
function rsi(a,n=14){const o=a.map(()=>null);if(a.length<=n)return o;let g=0,l=0;for(let i=1;i<=n;i++){const d=a[i]-a[i-1];d>0?g+=d:l-=d}g/=n;l/=n;o[n]=100-100/(1+g/(l||1e-9));for(let i=n+1;i<a.length;i++){const d=a[i]-a[i-1];g=(g*(n-1)+Math.max(d,0))/n;l=(l*(n-1)+Math.max(-d,0))/n;o[i]=100-100/(1+g/(l||1e-9))}return o}
function ind(c){const e12=ema(c,12),e26=ema(c,26),m=e12.map((v,i)=>v-e26[i]),s=ema(m,9);return{s20:sma(c,20),s50:sma(c,50),rsi:rsi(c),macd:m,sig:s,hist:m.map((v,i)=>v-s[i])}}
function sig(I,i){if(I.s50[i]==null||I.rsi[i]==null)return'ESPERA';let s=0;s+=I.s20[i]>I.s50[i]?1:-1;s+=I.rsi[i]<30?1:I.rsi[i]>70?-1:0;s+=I.hist[i]>0?1:-1;return s>=2?'COMPRA':s<=-2?'VENDA':'ESPERA'}
function trend(c){const n=20,y=c.slice(-n),m=y.reduce((a,b)=>a+b)/n;let nu=0,de=0;y.forEach((v,i)=>{nu+=(i-(n-1)/2)*(v-m);de+=(i-(n-1)/2)**2});const sl=nu/de/m*100*n;return sl>2?['Alta',sl]:sl<-2?['Baixa',sl]:['Lateral',sl]}
/* ===== backtest ===== */
function bt(c,sl,tp){const I=ind(c);let eq=1,pk=1,dd=0,pos=null,tr=[],cv=[];for(let i=50;i<c.length;i++){const p=c[i];if(pos){let ex=null;if(p<=pos*(1-sl/100))ex=1;else if(p>=pos*(1+tp/100))ex=1;else if(sig(I,i)==='VENDA')ex=1;if(ex){const r=p/pos-1;tr.push(r);eq*=1+r;pos=null}}else if(sig(I,i)==='COMPRA')pos=p;pk=Math.max(pk,eq);dd=Math.max(dd,1-eq/pk);cv.push(eq)}
const w=tr.filter(r=>r>0),l=tr.filter(r=>r<=0),gw=w.reduce((a,b)=>a+b,0),gl=-l.reduce((a,b)=>a+b,0);
return{n:tr.length,win:tr.length?w.length/tr.length*100:0,ret:(eq-1)*100,dd:dd*100,pf:gl?gw/gl:(gw?Infinity:0),cv}}
/* ===== gráficos ===== */
function draw(id,lines,o={}){const cv=$('#'+id);if(!cv)return;const N=120,dpr=devicePixelRatio||1,w=cv.clientWidth,h=cv.clientHeight;cv.width=w*dpr;cv.height=h*dpr;const x=cv.getContext('2d');x.scale(dpr,dpr);
lines=lines.map(l=>({...l,d:l.d.slice(-N)}));const n=lines[0].d.length,all=[];lines.forEach(l=>l.d.forEach(v=>{if(v!=null)all.push(v)}));
const mn=o.min??Math.min(...all),mx=o.max??Math.max(...all),X=i=>i/(n-1)*w,Y=v=>h-4-(v-mn)/(mx-mn||1)*(h-8);
x.setLineDash([3,3]);x.lineWidth=1;(o.lv||[]).forEach(v=>{x.strokeStyle=css('--mu');x.beginPath();x.moveTo(0,Y(v));x.lineTo(w,Y(v));x.stroke()});x.setLineDash([]);
lines.forEach(l=>{x.strokeStyle=l.col;x.lineWidth=l.w||1.5;x.beginPath();let s=0;l.d.forEach((v,i)=>{if(v==null)return;s?x.lineTo(X(i),Y(v)):x.moveTo(X(i),Y(v));s=1});x.stroke()})}
/* ===== simulador ===== */
const lastP=a=>a.c[a.c.length-1];
function closePos(i,why){const p=S.pos[i],a=S.assets.find(x=>x.sym===p.sym);const px=lastP(a);S.cash+=p.qty*px;S.hist.unshift({sym:p.sym,src:a.src,entry:p.entry,exit:px,qty:p.qty,pnl:(px-p.entry)*p.qty,why,t:new Date().toLocaleString('pt-BR')});S.pos.splice(i,1)}
function buy(){const a=A();if(S.pos.some(p=>p.sym===a.sym)){msg='Já existe posição simulada neste ativo.';return}
const px=lastP(a),{risk,sl,tp}=S.cfg;let q=S.cash*risk/100/(px*sl/100);if(q*px>S.cash)q=S.cash/px;if(q<=0){msg='Saldo simulado insuficiente.';return}
S.cash-=q*px;S.pos.push({sym:a.sym,entry:px,qty:q,sl:px*(1-sl/100),tp:px*(1+tp/100)});msg='Compra simulada executada.'}
function step(){const a=A();if(a.src!=='sim'){msg='Avanço de candle só existe para ativos simulados.';return}
a.c.push(+(lastP(a)*(1+(Math.random()-.495)*.03)).toFixed(2));for(let i=S.pos.length-1;i>=0;i--){const p=S.pos[i];if(p.sym!==a.sym)continue;const px=lastP(a);if(px<=p.sl)closePos(i,'Stop-loss');else if(px>=p.tp)closePos(i,'Take-profit')}}
/* ===== telas ===== */
const badge=a=>a.src==='sim'?'<span class="badge sim">DADOS SIMULADOS</span>':'<span class="badge real">DADOS REAIS (IMPORTADOS)</span>';
const note='<p class="warn">Ferramenta educacional de simulação. Nenhuma operação real, nenhuma corretora conectada. Não é recomendação de investimento.</p>';
const V={
dash(){const a=A(),c=a.c,I=ind(c),i=c.length-1,s=sig(I,i),[t,sl]=trend(c),ch=(c[i]/c[i-1]-1)*100;
return note+`<div class="card"><div class="row">${badge(a)}<span class="mu">${a.sym} · ${c.length} candles</span></div>
<div class="row" style="margin-top:8px"><b style="font-size:26px">${f(c[i])}</b><span class="${ch>=0?'up':'dn'}">${ch>=0?'+':''}${f(ch)}%</span><span class="pill ${s}">${s}</span></div>
<canvas id="c1" style="height:190px"></canvas><div class="mu">Preço · <span style="color:var(--ac)">SMA 20</span> · <span style="color:var(--wn)">SMA 50</span></div></div>
<div class="card"><div class="g"><div><span>RSI 14</span><b>${f(I.rsi[i])}</b></div><div><span>Tendência (20 candles)</span><b>${t} (${f(sl)}%)</b></div><div><span>SMA 20 / SMA 50</span><b>${f(I.s20[i])} / ${f(I.s50[i])}</b></div><div><span>MACD / sinal</span><b>${f(I.macd[i],3)} / ${f(I.sig[i],3)}</b></div></div></div>
<div class="card"><span class="mu">RSI 14</span><canvas id="c2" style="height:70px"></canvas><span class="mu">MACD 12/26/9 (linha, sinal, histograma)</span><canvas id="c3" style="height:90px"></canvas></div>`},
back(){const a=A(),r=bt(a.c,S.cfg.sl,S.cfg.tp);
return note+`<div class="card">${badge(a)}<h3>Backtest · ${a.sym}</h3><p class="mu">Estratégia: compra no sinal COMPRA, saída por VENDA, stop-loss ${S.cfg.sl}% ou take-profit ${S.cfg.tp}%. Apenas posições compradas, sem custos.</p>
<div class="g"><div><span>Operações</span><b>${r.n}</b></div><div><span>Taxa de acerto</span><b>${f(r.win,1)}%</b></div><div><span>Retorno total</span><b class="${r.ret>=0?'up':'dn'}">${f(r.ret)}%</b></div><div><span>Drawdown máx.</span><b>${f(r.dd)}%</b></div><div><span>Fator de lucro</span><b>${r.pf===Infinity?'∞':f(r.pf)}</b></div></div>
<canvas id="c4" style="height:150px"></canvas><span class="mu">Curva de capital (base 1,0)</span></div>`;},
sim(){const a=A(),px=lastP(a),I=ind(a.c),s=sig(I,a.c.length-1);
return note+`<div class="card">${badge(a)}<div class="row"><b>Saldo simulado: ${f(S.cash)}</b><span class="pill ${s}">${s}</span></div><p class="mu">${a.sym} a ${f(px)} · risco ${S.cfg.risk}% do saldo · SL ${S.cfg.sl}% · TP ${S.cfg.tp}%</p>
<div class="row"><button onclick="buy();save();R()">Comprar (simulado)</button><button class="s" onclick="step();save();R()">Avançar candle</button></div><p class="mu">${msg}</p></div>
<div class="card"><b>Posições abertas</b><div class="sc"><table><tr><th>Ativo</th><th>Entrada</th><th>SL</th><th>TP</th><th></th></tr>${S.pos.map((p,i)=>`<tr><td>${p.sym}</td><td>${f(p.entry)}</td><td>${f(p.sl)}</td><td>${f(p.tp)}</td><td><button class="s" onclick="closePos(${i},'Manual');save();R()">Fechar</button></td></tr>`).join('')||'<tr><td colspan=5 class="mu">Nenhuma</td></tr>'}</table></div></div>`},
hist(){const tot=S.hist.reduce((a,h)=>a+h.pnl,0);
return note+`<div class="card"><div class="row"><b>Histórico de operações</b><b class="${tot>=0?'up':'dn'}">${f(tot)}</b></div><div class="sc"><table><tr><th>Ativo</th><th>Entr.</th><th>Saída</th><th>P/L</th><th>Motivo</th></tr>${S.hist.map(h=>`<tr><td>${h.sym}${h.src==='sim'?' (sim)':''}</td><td>${f(h.entry)}</td><td>${f(h.exit)}</td><td class="${h.pnl>=0?'up':'dn'}">${f(h.pnl)}</td><td>${h.why}</td></tr>`).join('')||'<tr><td colspan=5 class="mu">Sem operações</td></tr>'}</table></div><button class="s" onclick="if(confirm('Apagar histórico?')){S.hist=[];save();R()}">Limpar histórico</button></div>`},
cfg(){return note+`<div class="card"><b>Gestão de risco</b>
<label>Saldo inicial simulado</label><input id="k0" type="number" value="${S.cfg.bal}">
<label>Risco por operação (% do saldo)</label><input id="k1" type="number" step="0.1" value="${S.cfg.risk}">
<label>Stop-loss (%)</label><input id="k2" type="number" step="0.1" value="${S.cfg.sl}">
<label>Take-profit (%)</label><input id="k3" type="number" step="0.1" value="${S.cfg.tp}"><br><br>
<button onclick="saveCfg()">Salvar e zerar saldo simulado</button><p class="mu">${msg}</p></div>
<div class="card"><b>Ativos</b>${S.assets.map((a,i)=>`<div class="row" style="margin:6px 0"><span>${a.sym} ${badge(a)}</span><button class="s d" style="color:#fff" onclick="delA(${i})">Remover</button></div>`).join('')}</div>
<div class="card"><b>Adicionar ativo</b><label>Símbolo</label><input id="n1" placeholder="ex.: MEU-ATIVO">
<label>Fechamentos reais (um por linha ou separados por vírgula, mínimo 60). Vazio = série simulada</label><textarea id="n2"></textarea><br><br><button onclick="addA()">Adicionar</button>
<p class="mu">O app não busca cotações. Dados reais só entram se você os importar aqui. A integração futura com MetaTrader 5 e APIs de mercado entra pela interface DataProvider do código.</p></div>
<div class="card"><button class="s" onclick="document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';R()">Alternar tema</button></div>`}};
const TABS=[['dash','Painel'],['back','Backtest'],['sim','Simulador'],['hist','Histórico'],['cfg','Ajustes']];
function saveCfg(){const v=i=>parseFloat($('#k'+i).value);const [b,r,s,t]=[0,1,2,3].map(v);if([b,r,s,t].some(x=>!(x>0))){msg='Valores inválidos.';R();return}S.cfg={bal:b,risk:r,sl:s,tp:t};S.cash=b;S.pos=[];msg='Configuração salva.';save();R()}
function addA(){const sym=$('#n1').value.trim().toUpperCase(),raw=$('#n2').value.trim();if(!sym){msg='Informe o símbolo.';R();return}if(S.assets.some(a=>a.sym===sym)){msg='Símbolo já existe.';R();return}
if(!raw){S.assets.push(mk(sym))}else{const c=raw.split(/[\s,;]+/).map(x=>parseFloat(x.replace(',','.'))).filter(x=>x>0);if(c.length<60){msg='Dados insuficientes (mínimo 60 valores válidos).';R();return}S.assets.push({sym,name:sym,src:'real',c})}msg='Ativo adicionado.';save();R()}
function delA(i){if(S.assets.length<2){msg='Mantenha ao menos um ativo.';R();return}const sym=S.assets[i].sym;S.pos=S.pos.filter(p=>p.sym!==sym);S.assets.splice(i,1);S.sel=0;save();R()}
function R(){const sel=$('#sel');sel.innerHTML=S.assets.map((a,i)=>`<option value="${i}" ${i===S.sel?'selected':''}>${a.sym}</option>`).join('');
$('#nav').innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';msg='';R()">${l}</button>`).join('');
try{$('#v').innerHTML=V[tab]()}catch(e){$('#v').innerHTML='<div class="card">Erro ao exibir a tela: '+e.message+'</div>';return}
const a=A(),I=ind(a.c);
if(tab==='dash'){draw('c1',[{d:a.c,col:css('--tx'),w:2},{d:I.s20,col:css('--ac')},{d:I.s50,col:css('--wn')}]);draw('c2',[{d:I.rsi,col:css('--ac')}],{min:0,max:100,lv:[30,70]});draw('c3',[{d:I.macd,col:css('--ac')},{d:I.sig,col:css('--wn')},{d:I.hist,col:css('--mu'),w:1}],{lv:[0]})}
if(tab==='back'){const r=bt(a.c,S.cfg.sl,S.cfg.tp);if(r.cv.length)draw('c4',[{d:r.cv,col:css('--up'),w:2}],{lv:[1]})}}
$('#sel').onchange=e=>{S.sel=+e.target.value;save();R()};
addEventListener('resize',R);R();
</script></body></html>
