name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Testes e APK debug
        run: gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace
      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk EISENBERG_TRADER.apk
      - uses: actions/upload-artifact@v4
        with:
          name: EISENBERG_TRADER-apk
          path: EISENBERG_TRADER.apk
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorios-de-erro
          path: |
            app/build/reports
            app/build/test-results
